[project]
name = "agentguard-sandbox"
version = "0.1.0"
description = "AgentGuard disposable Playwright sandbox worker"
requires-python = ">=3.11,<3.12"
dependencies = [
    "agentguard-contracts",
    "playwright==1.64.0",
]

[tool.uv.sources]
agentguard-contracts = { path = "../shared/contracts-py" }

[dependency-groups]
dev = [
    "black==26.10.1",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
