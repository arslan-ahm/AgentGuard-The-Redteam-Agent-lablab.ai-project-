<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Product hero template</title>
<style>
  /* Reusable layout. Content comes from a brief (media/briefs/*.json) via window.applyBrief.
     Sizes are relative to the canvas, so one template renders every export size. */
  :root { --u: min(1vw, 1.78vh); }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: var(--body);
  }
  .canvas {
    position: relative; width: 100vw; height: 100vh; box-sizing: border-box;
    padding: calc(var(--u) * 4.5); display: grid; gap: calc(var(--u) * 4);
    grid-template-columns: 1fr 1.15fr; align-items: center;
    background: radial-gradient(120% 90% at 75% 40%, #16304a 0%, var(--bg) 60%);
    background-size: cover; background-position: center;
  }
  .canvas.has-bg::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--bg) 25%, transparent 75%); }
  .portrait { grid-template-columns: 1fr; grid-template-rows: auto 1fr; align-items: start; }
  .copy { position: relative; display: grid; gap: calc(var(--u) * 1.8); align-content: center; }
  .brand { display: flex; align-items: center; gap: calc(var(--u) * 1.2); font: 700 calc(var(--u) * 2.6) var(--display); }
  .brand svg { width: calc(var(--u) * 3.6); height: auto; }
  h1 { margin: 0; font: 700 calc(var(--u) * 5.2) / 1.06 var(--display); letter-spacing: -.01em; }
  .sub { margin: 0; font-size: calc(var(--u) * 2.05); line-height: 1.4; color: var(--muted); max-width: 36ch; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: calc(var(--u) * 1.1); }
  li { display: flex; align-items: center; gap: calc(var(--u) * 1); font-size: calc(var(--u) * 1.9); }
  li::before { content: ""; width: calc(var(--u) * 1.6); height: calc(var(--u) * .9); border-left: calc(var(--u) * .45) solid var(--ok); border-bottom: calc(var(--u) * .45) solid var(--ok); transform: rotate(-45deg) translateY(-25%); }
  .cta { justify-self: start; background: var(--accent); color: var(--bg); font: 700 calc(var(--u) * 2.3) var(--display); padding: calc(var(--u) * 1.3) calc(var(--u) * 3); border-radius: 999px; white-space: nowrap; }
  .visual { position: relative; display: grid; place-items: center; min-height: 0; height: 100%; }
  .visual img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: calc(var(--u) * 1.6); border: 2px solid var(--line); box-shadow: 0 calc(var(--u) * 3) calc(var(--u) * 6) rgb(4 10 16 / .6); }
</style>
</head>
<body>
<div class="canvas" id="canvas">
  <div class="copy">
    <div class="brand" id="brand"></div>
    <h1 id="headline"></h1>
    <p class="sub" id="sub"></p>
    <ul id="benefits"></ul>
    <div class="cta" id="cta"></div>
  </div>
  <div class="visual"><img id="product" alt=""></div>
</div>
<script>
const SHIELD = (stroke, fill) => `<svg viewBox="-60 -70 120 150" xmlns="http://www.w3.org/2000/svg"><path d="M0,-62 L52,-42 L52,4 C52,40 27,62 0,74 C-27,62 -52,40 -52,4 L-52,-42 Z" fill="${fill}" stroke="${stroke}" stroke-width="8" stroke-linejoin="round"/><path d="M-22,4 L-6,20 L24,-14" fill="none" stroke="${stroke}" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/** Fill the template from a brief. Returns a promise that resolves when images are loaded. */
window.applyBrief = (brief, brand, assets) => {
  const p = brand.palette, root = document.documentElement.style;
  for (const [k, v] of Object.entries({ bg: p.bg, ink: p.ink, muted: p.muted, accent: p.accent, ok: p.ok, line: p.line })) root.setProperty(`--${k}`, v);
  root.setProperty("--display", brand.type.display);
  root.setProperty("--body", brand.type.body);
  const canvas = document.getElementById("canvas");
  canvas.classList.toggle("portrait", innerHeight > innerWidth * 1.05);
  if (assets.background) { canvas.style.backgroundImage = `url("${assets.background}")`; canvas.classList.add("has-bg"); }
  document.getElementById("brand").innerHTML = SHIELD(p.accent, p.panel) + `<span>${brand.name}</span>`;
  document.getElementById("headline").textContent = brief.headline;
  document.getElementById("sub").textContent = brief.subheadline;
  document.getElementById("benefits").innerHTML = (brief.benefits || []).map(b => `<li></li>`).join("");
  [...document.querySelectorAll("#benefits li")].forEach((li, i) => li.append(brief.benefits[i]));
  document.getElementById("cta").textContent = brief.cta;
  const img = document.getElementById("product");
  img.alt = brief.product_alt || "";
  return new Promise(resolve => { img.onload = img.onerror = () => resolve(true); img.src = assets.product_image; });
};
</script>
</body>
</html>
