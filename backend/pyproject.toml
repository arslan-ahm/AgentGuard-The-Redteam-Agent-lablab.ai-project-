[project]
name = "agentguard-backend"
version = "0.1.0"
description = "AgentGuard API, orchestrator, agent and policy"
requires-python = ">=3.11,<3.12"
dependencies = [
    "agentguard-contracts",
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "openai==3.46.0",
    "psycopg[binary]==3.3.8",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "redis==8.1.0",
    "rq==3.0.0",
    "sqlalchemy==2.1.8",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
agentguard-contracts = { path = "../shared/contracts-py", editable = false }
