# Quality gate for every pull request into main (and every push to main).
# Branch protection requires the "CI passed" job, so nothing merges unless all checks pass.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests, lint, types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.9"
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run mypy app tests

  sandbox:
    name: Sandbox worker (tests, lint, types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandbox-worker
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.9"
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run mypy runner.py checks tests

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run build

  docker:
    name: Docker (compose valid, all images build)
    runs-on: ubuntu-latest
    env:
      # Dummy values only so compose can be validated and built. Not secrets.
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-only
      POSTGRES_DB: ci
      SECRET_KEY: ci-only
      ALLOWED_ORIGINS: http://localhost
      PUBLIC_BASE_URL: http://localhost
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: docker compose config --quiet
      - run: docker compose --profile build-only build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-passed:
    name: CI passed
    if: always()
    needs: [backend, sandbox, frontend, docker, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::A required check did not pass ($r)."
              exit 1
            fi
          done
