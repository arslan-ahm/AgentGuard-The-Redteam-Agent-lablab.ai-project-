[project]
name = "agentguard-demo-store"
version = "0.1.0"
description = "Deliberately flawed demo store: the AgentGuard demo scan target. NEVER deploy publicly."
requires-python = ">=3.11,<3.12"
dependencies = ["flask>=3.1,<4"]

[dependency-groups]
dev = ["black>=26", "pytest>=9", "ruff>=0.17"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
